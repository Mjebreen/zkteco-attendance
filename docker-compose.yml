# ZKTeco Attendance
#
#   docker compose up -d                       # web + collector, SQLite on the `data` volume
#   docker compose --profile postgres up -d    # same, plus a Postgres server (set DATABASE_URL accordingly)
#
# Everything is configured through .env (copy .env.example).

services:
  web:
    build: .
    image: zkteco-attendance:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/attendance.db}
      OUTPUT_DIR: ${OUTPUT_DIR:-/data/reports}
    ports:
      - "${SERVER_PORT:-5000}:${SERVER_PORT:-5000}"
    volumes:
      - data:/data
    command: ["python", "-m", "app.main"]

  collector:
    build: .
    image: zkteco-attendance:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/attendance.db}
      HEARTBEAT_FILE: /tmp/collector-heartbeat
    volumes:
      - data:/data
    depends_on:
      web:
        condition: service_healthy
    command: ["python", "-m", "collector.main"]
    healthcheck:
      test: ["CMD", "python", "scripts/collector_healthcheck.py"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attendance}
      POSTGRES_USER: ${POSTGRES_USER:-attendance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-attendance} -d ${POSTGRES_DB:-attendance}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  data:
  pgdata:
