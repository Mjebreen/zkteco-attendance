# nginx reverse proxy for the attendance web service (TLS via certbot / your own certs).
# Drop into /etc/nginx/sites-available/attendance and symlink into sites-enabled.

server {
    listen 80;
    server_name attendance.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name attendance.example.com;

    ssl_certificate     /etc/letsencrypt/live/attendance.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/attendance.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20m;          # /api/ingest payloads from a remote collector

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;        # range PDFs / manual "Sync now" can take a few seconds
    }
}
